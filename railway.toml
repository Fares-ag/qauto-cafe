# Default Railway config — points at the API (NestJS backend).
# For a separate web service, set Config file path to apps/web/railway.toml in Railway settings.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
watchPatterns = ["apps/api/**", "packages/shared-types/**", "prisma/**", "scripts/**"]

[deploy]
startCommand = "sh scripts/docker-api-entrypoint.sh"
healthcheckPath = "/api/v1/health/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
numReplicas = 1
