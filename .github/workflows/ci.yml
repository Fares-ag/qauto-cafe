name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qauto_cafe
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qauto_cafe?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/qauto_cafe?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-minimum-length
      JWT_REFRESH_SECRET: ci-refresh-secret-minimum-length
      TERMINAL_ENROLLMENT_SECRET: ci-terminal-enrollment-secret
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build --workspace=@qauto/shared-types
      - run: npm run build --workspace=@qauto/api-client
      - run: npm run build --workspace=@qauto/api
      - run: npm run test --workspace=@qauto/api
      - run: npm run build --workspace=@qauto/web

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t qauto-api:ci .
      - name: Build Web image
        run: docker build -f apps/web/Dockerfile -t qauto-web:ci .

  playwright:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qauto_cafe
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qauto_cafe?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/qauto_cafe?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-minimum-length
      JWT_REFRESH_SECRET: ci-refresh-secret-minimum-length
      TERMINAL_ENROLLMENT_SECRET: ci-terminal-enrollment-secret
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_API_URL: /api/v1
      API_PROXY_TARGET: http://localhost:3001
      NEXT_PUBLIC_WS_URL: http://localhost:3001/ws
      PLAYWRIGHT_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build --workspace=@qauto/shared-types
      - run: npm run build --workspace=@qauto/api-client
      - run: npm run build --workspace=@qauto/web
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          API_PROXY_TARGET: http://localhost:3001
      - run: npx playwright install chromium --with-deps
        working-directory: apps/web
      - name: Start API
        run: |
          npm run build --workspace=@qauto/api
          node apps/api/dist/main.js &
          sleep 5
      - name: Start Web
        run: |
          API_PROXY_TARGET=http://localhost:3001 NEXT_PUBLIC_API_URL=/api/v1 npm run start --workspace=@qauto/web &
          sleep 10
      - name: Run Playwright
        run: npx playwright test
        working-directory: apps/web
