# Railway config for the API service.
# In Railway → @qauto/api → Settings → Config file path: apps/api/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
watchPatterns = ["apps/api/**", "packages/shared-types/**", "prisma/**", "scripts/**"]

[deploy]
healthcheckPath = "/api/v1/health/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
numReplicas = 1
