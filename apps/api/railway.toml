# Railway config for the API service.
#
# Railway → @qauto/api → Settings:
#   Config file path: apps/api/railway.toml
#   Clear "Build command" (Dockerfile handles build)
#
# Variables: see deploy/railway.api.env.example

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
watchPatterns = ["apps/api/**", "packages/shared-types/**", "prisma/**", "scripts/**"]

[deploy]
# Use Dockerfile entrypoint (migrations + start). Clear any custom start command in Railway UI.
startCommand = "sh scripts/docker-api-entrypoint.sh"
healthcheckPath = "/api/v1/health/live"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
numReplicas = 1
