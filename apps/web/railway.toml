# Railway config for the web service (optional — Vercel is the recommended host).
# In Railway → @qauto/web → Settings → Config file path: apps/web/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"
watchPatterns = ["apps/web/**", "packages/**"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
numReplicas = 1
